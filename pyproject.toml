[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-downloader"
version = "0.1.0"
description = "Windows desktop universal downloader"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pywebview>=5.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0,<7.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
